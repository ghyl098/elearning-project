{% extends 'base.html' %}
{% block title %}Add Routine{% endblock %}

{% block extra_css %}
<style>
    .form-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 32px;
    }

    .form-card h3 {
        color: #0f172a;
        font-weight: 700;
        font-size: 1.3rem;
        margin-bottom: 22px;
    }

    .form-label {
        color: #334155;
        font-size: 0.88rem;
        font-weight: 600;
        margin-bottom: 6px;
    }

    .form-control,
    .form-select {
        border: 1px solid #e2e8f0;
        border-radius: 7px;
        padding: 10px 12px;
        font-size: 0.9rem;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #93c5fd;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-primary-edu {
        background: #2563eb;
        border: 1px solid #2563eb;
        color: white;
        font-weight: 600;
        padding: 10px;
        border-radius: 7px;
        width: 100%;
    }

    .btn-primary-edu:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="form-card">
                <h3>{% if editing %}Edit Routine{% else %}Add Routine{% endif %}</h3>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn-primary-edu mt-2">{% if editing %}Save Changes{% else %}Save
                        Routine{% endif %}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
