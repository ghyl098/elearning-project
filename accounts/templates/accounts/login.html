{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}

{% block extra_css %}
<style>
    .auth-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: white; border: 1px solid #e5e7eb; border-radius: 14px; padding: 40px; width: 100%; max-width: 420px; }
    .auth-icon { width: 48px; height: 48px; border-radius: 10px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 18px; }
    .auth-card h3 { color: #0f172a; font-weight: 700; font-size: 1.4rem; margin-bottom: 4px; }
    .auth-card .sub { color: #64748b; font-size: 0.88rem; margin-bottom: 26px; }
    .form-label { color: #334155; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
    .form-control { border: 1px solid #e2e8f0; border-radius: 7px; padding: 10px 12px; font-size: 0.9rem; }
    .form-control:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .btn-primary-edu { background: #2563eb; border: 1px solid #2563eb; color: white; font-weight: 600; padding: 11px; border-radius: 7px; width: 100%; font-size: 0.92rem; }
    .btn-primary-edu:hover { background: #1d4ed8; border-color: #1d4ed8; color: white; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.88rem; color: #64748b; }
    .auth-footer a { color: #2563eb; font-weight: 600; }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-icon"><i class="bi bi-mortarboard-fill"></i></div>
            <h3>Welcome back</h3>
            <p class="sub">Sign in to access your dashboard</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary-edu mt-2">Sign In</button>
            </form>
            <p class="auth-footer">No account? <a href="{% url 'register' %}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
